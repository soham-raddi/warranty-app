{% extends 'base.html' %}

{% block title %}Assistant | Digital Twin{% endblock %}

{% block content %}
<div class="ai-shell" id="aiShell">
    <aside class="ai-sidebar" id="aiSidebar" aria-label="Conversations">
        <div class="ai-sidebar-head">
            <span class="ai-sidebar-title">Chats</span>
            <button type="button" class="btn btn-primary btn-sm ai-new-btn" onclick="startNewConversation()">
                <i class="bi bi-plus-lg"></i> New chat
            </button>
        </div>
        <div class="ai-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="chatSearchInput" class="form-control form-control-sm" placeholder="Search chats" aria-label="Search chats">
        </div>
        <div class="ai-conversations" id="recentConversations"></div>
        <button type="button" class="ai-clear-btn" onclick="clearChatHistory()"><i class="bi bi-trash3"></i> Clear all chats</button>
    </aside>

    <section class="ai-main" aria-label="Chat">
        <header class="ai-main-head">
            <button type="button" class="btn btn-sm ai-icon-btn d-lg-none" onclick="toggleChatSidebar()" aria-label="Show chats" aria-controls="aiSidebar">
                <i class="bi bi-layout-sidebar"></i>
            </button>
            <div class="ai-main-title" id="chatTitle">New chat</div>
            <button type="button" class="btn btn-sm ai-icon-btn d-lg-none" onclick="startNewConversation()" aria-label="New chat">
                <i class="bi bi-plus-lg"></i>
            </button>
        </header>

        <div class="ai-thread" id="chatThread" aria-live="polite"></div>

        <form class="ai-composer" id="chatComposer">
            <div class="ai-composer-box">
                <textarea id="chatInput" rows="1" maxlength="2000" placeholder="Ask anything about your items…" aria-label="Message"></textarea>
                <button type="submit" class="btn btn-primary ai-send-btn" id="chatSendBtn" aria-label="Send" disabled>
                    <i class="bi bi-arrow-up"></i>
                </button>
            </div>
            <div class="ai-composer-note">Enter to send, Shift+Enter for a new line. Answers come from your inventory and can contain mistakes.</div>
        </form>
    </section>
</div>
{% endblock %}
