<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Digital Twin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="container py-3">
            <div class="app-header-inner">
                <a class="brand-link" href="{{ url_for('pages.dashboard_page') }}">
                    <span class="brand-icon"><i class="bi bi-cpu"></i></span>
                    <div>
                        <div class="brand-title">Digital Twin</div>
                        <div class="brand-subtitle">Smart Inventory and Warranty Manager</div>
                    </div>
                </a>
                <nav class="app-nav">
                    <a class="app-nav-link {% if current_page == 'dashboard' %}active{% endif %}" href="{{ url_for('pages.dashboard_page') }}">Dashboard</a>
                    <a class="app-nav-link {% if current_page == 'upload' %}active{% endif %}" href="{{ url_for('pages.upload_page') }}">Upload</a>
                    <a class="app-nav-link {% if current_page == 'inventory' %}active{% endif %}" href="{{ url_for('pages.inventory_page') }}">Inventory</a>
                    <a class="app-nav-link {% if current_page == 'assistant' %}active{% endif %}" href="{{ url_for('pages.assistant_page') }}">Assistant</a>
                    <a class="app-nav-link {% if current_page == 'settings' %}active{% endif %}" href="{{ url_for('pages.settings_page') }}">Settings</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    {% block modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}?v=20260623-1"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
