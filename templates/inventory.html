{% extends 'base.html' %}

{% block title %}Inventory | Digital Twin{% endblock %}

{% block content %}
<section class="page-hero mb-4">
    <h1 class="page-title">Inventory</h1>
    <p class="page-subtitle">Track all registered items, their receipts, and warranty card status.</p>
</section>

<section class="row g-4 mb-4">
    <div class="col-md-6">
        <div class="card stat-card bg-primary p-4 shadow-sm">
            <h6>Total Investment</h6>
            <h1 id="s-tot" class="fw-bold">Rs 0</h1>
            <i class="bi bi-wallet2"></i>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card stat-card bg-success p-4 shadow-sm">
            <h6>Active Warranties</h6>
            <h1 id="s-act" class="fw-bold">0</h1>
            <i class="bi bi-shield-check"></i>
        </div>
    </div>
</section>

<section class="card section-card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Product</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Warranty</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="invTable"></tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
